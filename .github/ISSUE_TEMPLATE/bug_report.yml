name: Bug report
description: Something in Seedling does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems do not belong here**: please use private
        vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open seedling.html in ...\n2. Move the pointer ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v0.1.0, or output of git rev-parse --short HEAD"
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "Firefox 140 on Windows 11"
  - type: textarea
    id: console
    attributes:
      label: Console output or screenshots
      render: text
