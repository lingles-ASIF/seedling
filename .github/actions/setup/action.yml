# Local composite action shared by ci.yml and release.yml.
# Pinning note: GitHub recommends pinning third-party actions to a full commit
# SHA (https://docs.github.com/en/actions/reference/security/secure-use).
# These are pinned to major versions; Dependabot (dependabot.yml) proposes
# updates. Replace tags with SHAs once the repository exists.
name: Seedling toolchain
description: Rust 1.97.0 (pinned) + wasm32 target + clippy, Node 22, Python 3.12 and optionally Playwright Chromium
inputs:
  browser:
    description: Install Playwright and headless Chromium for the browser check
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@master
      with:
        # Keep in sync with rust-toolchain.toml (the pinned release).
        toolchain: "1.97.0"
        # Keep in sync with [build].wasm_target in governance/config.toml.
        targets: wasm32-unknown-unknown
        components: clippy
    - uses: actions/setup-node@v5
      with:
        node-version: "22"
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install Playwright Chromium
      if: inputs.browser == 'true'
      shell: bash
      run: |
        python -m pip install --upgrade pip playwright
        python -m playwright install --with-deps chromium
    - name: Tool versions
      shell: bash
      run: |
        rustc --version; cargo --version; cargo clippy --version
        node --version; python --version
