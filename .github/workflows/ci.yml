# Security gate on every push and pull request.
#
# Action pinning: pinned to major versions at minimum. GitHub recommends
# pinning to full commit SHAs (see security/WORKS_CITED.md, "Secure use
# reference"); do so once the repository exists. Dependabot keeps them current.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Security gate (full)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write # sticky score comment on PRs
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # audit/exec-summary read history
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Run security gate (full)
        id: gate
        continue-on-error: true # report and comment first, enforce below
        run: python3 security/gate.py --full

      - name: Job summary
        if: always()
        run: |
          if [ -f security/reports/latest.md ]; then cat security/reports/latest.md >> "$GITHUB_STEP_SUMMARY"; fi
          python3 tools/audit.py summary --markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-${{ github.sha }}
          path: |
            security/reports/latest.json
            security/reports/latest.md
            security/reports/history/
          if-no-files-found: warn
          retention-days: 90

      - name: Sticky PR comment with the score table
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true # fork PRs receive a read-only token
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- seedling-security-gate -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            try {
              const r = JSON.parse(fs.readFileSync('security/reports/latest.json', 'utf8'));
              const esc = s => String(s).replace(/\|/g, '\\|').replace(/\r?\n/g, ' ').slice(0, 140);
              const icon = { pass: 'pass', fail: '**FAIL**', skipped: 'skipped', info: 'info' };
              const rows = r.checks.map(c =>
                `| ${icon[c.status]} | \`${c.id}\` | ${c.weight} | ${c.critical ? 'yes' : ''} | ${esc(c.evidence)} |`);
              body = [
                marker,
                `### Security gate: ${r.verdict}, score ${r.score.toFixed(1)} / ${r.threshold}`,
                '',
                `Commit \`${r.git.head.slice(0, 10)}\`, ${r.mode} mode, fuzz ${r.fuzz_frames.toLocaleString('en-US')} frames.` +
                (r.critical_failures.length ? ` Critical failures: ${r.critical_failures.join(', ')}.` : ''),
                r.skipped.length ? `Skipped (not scored): ${r.skipped.join(', ')}.` : '',
                '',
                '| Result | Check | Weight | Critical | Evidence |',
                '|---|---|---:|:---:|---|',
                ...rows,
                '',
                `Full report and sources: [workflow run artifacts](${runUrl}).`,
              ].join('\n');
            } catch (e) {
              body = `${marker}\n### Security gate: no report produced\nSee the [workflow run](${runUrl}).`;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Enforce gate verdict
        if: steps.gate.outcome != 'success'
        run: |
          echo "::error::Security gate failed; see security/reports/latest.md in the artifacts."
          exit 1
