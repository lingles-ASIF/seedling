# Daily project tracker: crates.io downloads, stars/forks/watchers, issues,
# PRs, change requests, recent comments, release downloads. Updates the
# single pinned issue "Project status & tracker" and attaches TRACKER.md and
# tracker.json to each run. It does not commit: main is protected by a ruleset
# (pull requests + security gate only), and a read-only token is safer.
# Logic: tools/tracker.py (stdlib only);
# test locally with `python3 tools/tracker.py --dry-run`.
#
# Action pinning: major versions; SHA pinning recommended (see ci.yml).
name: Tracker

on:
  schedule:
    - cron: "17 13 * * *" # daily, 13:17 UTC (jittered minute)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # read-only: reports go to the issue and run artifacts
      issues: write # update the status issue
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect metrics and update the status issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/tracker.py --out TRACKER.md --json tracker.json --update-issue
          cat TRACKER.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: tracker-${{ github.run_id }}
          path: |
            TRACKER.md
            tracker.json
          retention-days: 90
