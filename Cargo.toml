[workspace]
resolver = "3"
members = ["crates/seedling", "crates/seedling-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Scott Lingley"]
repository = "https://github.com/lingles-ASIF/seedling"

# Security posture for every crate in the workspace (checked by the gate).
[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true
overflow-checks = true # integer overflow traps instead of wrapping

[profile.dev]
panic = "abort"
