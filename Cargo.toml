[package]
name = "seedling"
version = "0.1.0"
edition = "2024"
description = "A pointer-guided growing branch: Rust simulation compiled to WebAssembly"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["wasm", "generative", "animation", "plant", "no-std"]
categories = ["wasm", "no-std", "graphics", "simulation"]
# repository = "https://github.com/OWNER/seedling"   # set once the GitHub repo exists

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"] # the engine uses core::arch::wasm32

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true
overflow-checks = true # integer overflow traps instead of wrapping

[profile.dev]
panic = "abort"
